<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sản Phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px 15px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop Asus Zenbook</td>
                <td>21.500.000 VNĐ</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Điện thoại iPhone 15</td>
                <td>22.990.000 VNĐ</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Tai nghe Bluetooth Sony</td>
                <td>3.200.000 VNĐ</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Bàn phím cơ Logitech</td>
                <td>1.850.000 VNĐ</td>
                <td>15</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
